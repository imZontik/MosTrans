name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ml-service/requirements.txt

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q

      - name: ML service tests
        working-directory: ml-service
        run: |
          pip install -q -r requirements.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend type check and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # Images are built here, not on the VPS: 1 GB of RAM is enough to run the stack but not to build the frontend
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          cp .env.example .env
          docker compose build backend ml-service frontend
          docker save magistral-400-backend magistral-400-ml-service magistral-400-frontend | gzip -1 > images.tar.gz

      - name: SSH access
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload and restart
        env:
          TARGET: deploy@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$TARGET" 'mkdir -p /opt/magistral/nginx /opt/magistral/prometheus /opt/magistral/caddy'
          scp docker-compose.yml docker-compose.prod.yml deploy/deploy.sh images.tar.gz "$TARGET":/opt/magistral/
          scp nginx/nginx.conf "$TARGET":/opt/magistral/nginx/
          scp prometheus/prometheus.yml "$TARGET":/opt/magistral/prometheus/
          scp caddy/Caddyfile "$TARGET":/opt/magistral/caddy/
          ssh "$TARGET" 'bash /opt/magistral/deploy.sh'
