name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ml-service/requirements.txt

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q

      - name: ML service tests
        working-directory: ml-service
        run: |
          pip install -q -r requirements.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend type check and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # Images are built here, not on the VPS: 1 GB of RAM is enough to run the stack but not to build the frontend.
  # They go to GitHub Container Registry with a layer cache, and the server pulls only the layers that changed
  # (usually just the code): pushing whole image archives from GitHub to the VPS became far too slow.
  # Uploading archives stays as a fallback for when the server cannot reach the registry.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    # Deploys queue up behind each other, so a stuck one must not hold the queue for hours
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGES: ghcr.io/imzontik/mostrans
      TAG: ${{ github.sha }}
      TARGET: deploy@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGES }}-backend:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build ML service
        uses: docker/build-push-action@v6
        with:
          context: ml-service
          push: true
          tags: ${{ env.IMAGES }}-ml-service:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ml-service
          cache-to: type=gha,scope=ml-service,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGES }}-frontend:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Mirror third-party images to ghcr.io
        # Docker Hub is unreachable from the VPS: it takes Postgres, Grafana and the rest from our mirror.
        # A one-line rebuild (same layers) adds the source label, which links the package to this repository:
        # without it the job token may not write there. deploy.sh maps the tags back to the usual names.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile monitoring config --images \
            | grep -v '^magistral-400-' | sort -u | while read -r image; do
              tag=$(echo "$image" | sed 's#^docker.io/##; s#[/:]#-#g')
              if docker buildx imagetools inspect "$IMAGES-thirdparty:$tag" >/dev/null 2>&1; then
                echo "$image: already mirrored"
              else
                printf 'FROM %s\nLABEL org.opencontainers.image.source=https://github.com/%s\n' "$image" "$GITHUB_REPOSITORY" \
                  | docker buildx build --quiet --platform linux/amd64 -t "$IMAGES-thirdparty:$tag" --push -
                echo "$image: mirrored"
              fi
            done

      - name: SSH access
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          # Never wait for a prompt, give up on a silent server, notice a dropped connection within a minute
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

      - name: Server answers over SSH
        timeout-minutes: 3
        run: |
          for attempt in 1 2 3; do
            if ssh "$TARGET" true; then exit 0; fi
            echo "SSH attempt $attempt failed, retrying…"
            sleep 15
          done
          echo "::error::The VPS does not answer over SSH: check that it is running and has free memory (reboot it from the hosting panel if it is stuck)"
          exit 1

      - name: Upload configs
        timeout-minutes: 5
        run: |
          ssh "$TARGET" 'mkdir -p /opt/magistral/nginx /opt/magistral/prometheus /opt/magistral/caddy /opt/magistral/images && rm -f /opt/magistral/images.tar.gz'
          scp docker-compose.yml docker-compose.prod.yml deploy/deploy.sh "$TARGET":/opt/magistral/
          scp nginx/nginx.conf "$TARGET":/opt/magistral/nginx/
          scp prometheus/prometheus.yml "$TARGET":/opt/magistral/prometheus/
          scp caddy/Caddyfile "$TARGET":/opt/magistral/caddy/
          ssh "$TARGET" 'rm -rf /opt/magistral/monitoring'
          scp -r monitoring "$TARGET":/opt/magistral/

      - name: Pull images on the server and restart
        id: pull
        continue-on-error: true
        # The first deploy with monitoring also pulls Grafana, Loki and Alloy from Docker Hub
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token lets the server read this repository's images; it expires when the job ends
          echo "$GH_TOKEN" | ssh "$TARGET" "timeout 60 docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          trap 'ssh "$TARGET" "docker logout ghcr.io" >/dev/null 2>&1 || true' EXIT
          # The server stops itself too, so a fallback never races with a pull still running there
          ssh "$TARGET" "timeout 1080 bash /opt/magistral/deploy.sh pull $IMAGES $TAG"

      - name: Fallback — upload image archives and restart
        if: steps.pull.outcome == 'failure'
        timeout-minutes: 15
        run: |
          echo "::warning::The server could not pull from ghcr.io, uploading image archives instead"
          for svc in backend ml-service frontend; do
            docker pull -q "$IMAGES-$svc:$TAG"
            docker tag "$IMAGES-$svc:$TAG" "magistral-400-$svc:latest"
            docker save "magistral-400-$svc:latest" | gzip -1 > "$svc.tar.gz"
          done
          ls -lh ./*.tar.gz
          # One connection per image: a slow link is often slow per connection
          pids=()
          for svc in backend ml-service frontend; do
            scp "$svc.tar.gz" "$TARGET":/opt/magistral/images/ &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          ssh "$TARGET" 'bash /opt/magistral/deploy.sh load'
