global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    dns_sd_configs:
      - names: [backend]
        type: A
        port: 8000
    metrics_path: /metrics

  - job_name: ml-service
    static_configs:
      - targets: ["ml-service:8001"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Monitoring stack itself (docker compose profile "monitoring"): down while the profile is off
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
