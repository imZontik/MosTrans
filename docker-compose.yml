name: magistral-400

x-restart: &restart
  restart: unless-stopped

services:
  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    <<: *restart
    build: ./frontend

  backend:
    <<: *restart
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-magistral}:${POSTGRES_PASSWORD:-magistral}@postgres:5432/${POSTGRES_DB:-magistral}
      VALKEY_URL: redis://valkey:6379/0
      ML_SERVICE_URL: http://ml-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    <<: *restart
    build: ./ml-service
    env_file: .env

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magistral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magistral}
      POSTGRES_DB: ${POSTGRES_DB:-magistral}
    # Local access for IDE / psql only (not exposed to the network)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magistral}"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    <<: *restart
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
      - ml-service

  # --- Monitoring (profile "monitoring"): Grafana on top of Prometheus metrics and Loki logs.
  # Locally: docker compose --profile monitoring up -d → http://localhost:3000
  # On the VPS deploy.sh turns the profile on by itself when the server has enough memory.
  loki:
    <<: *restart
    image: grafana/loki:3.7.8
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/loki.yml"]
    environment:
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  # Collects the logs of every container of this project and ships them to Loki
  alloy:
    <<: *restart
    image: grafana/alloy:v1.20.0
    profiles: ["monitoring"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      GOMEMLIMIT: 150MiB
    mem_limit: 192m
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    <<: *restart
    image: grafana/grafana:13.2.2
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/magistral-400.json
      GF_USERS_DEFAULT_LANGUAGE: ru-RU
    # Grafana 13 settles at ~280 MB
    mem_limit: 400m
    # Not on the internet: open it locally or through an SSH tunnel
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # Local open-source LLM (Qwen 2.5) for answer grading and scenario drafts.
  # Enable with: docker compose --profile qwen up -d  and ML_PROVIDER=ollama in .env
  ollama:
    <<: *restart
    image: ollama/ollama:latest
    profiles: ["qwen"]
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  valkey-data:
  prometheus-data:
  ollama-data:
  loki-data:
  alloy-data:
  grafana-data:
