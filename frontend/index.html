<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E9ECEF" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Theme before first paint: saved choice, else the system setting (see src/theme/ThemeContext.tsx)
      ;(function () {
        var p = null
        try {
          p = localStorage.getItem('m400-theme')
        } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        if (dark) root.classList.add('dark')
        root.style.colorScheme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#0B1220' : '#E9ECEF')
      })()
    </script>
    <meta name="description" content="Магистраль 400 — геймифицированное обучение проводников ВСМ" />
    <title>Магистраль 400</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
