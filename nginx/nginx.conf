server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # Docker DNS: containers get new IPs when a deploy recreates them, so resolve
    # upstreams per request (proxy_pass with a variable) instead of once at startup
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:80;

    # Metrics are scraped by Prometheus inside the network, never exposed outside
    location = /metrics { return 404; }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM grading and scenario drafts may take a while
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        # Allow embedding as a web view into apps and messengers
        add_header Content-Security-Policy "frame-ancestors *" always;
    }
}
